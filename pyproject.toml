[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-compare-plugin"
version = "0.1.0"
description = "An LLM plugin for comparing responses from multiple language models"
readme = "README.md"
requires-python = ">=3.10"

license = {text = "Apache-2.0"}

authors = [
    {name = "Srikar Manthatti"}
]

dependencies = [
    "llm"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
test = [
    "pytest"
]

[project.entry-points.llm]
compare = "llm_compare"

[project.urls]
Homepage = "https://github.com/SrikarManthatti/llm-compare-plugin"
Repository = "https://github.com/SrikarManthatti/llm-compare-plugin"
Issues = "https://github.com/SrikarManthatti/llm-compare-plugin/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
